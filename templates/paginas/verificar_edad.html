<!DOCTYPE html>
<html lang="es-cl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verificación de edad — Puro Tabaco</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Lora:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --green: #30483A;
      --green-d: #253729;
      --tan: #C8B08A;
      --tan-l: rgba(200, 176, 138, 0.4);
      --cream: #EFE6D6;
      --cream-d: #D9CDB8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--green);
      color: var(--cream);
      font-family: 'Lora', serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
      background-image:
        radial-gradient(circle at 20% 10%, rgba(200,176,138,0.06), transparent 40%),
        radial-gradient(circle at 80% 90%, rgba(200,176,138,0.04), transparent 45%);
    }
    .card {
      background: var(--green-d);
      border: 1px solid rgba(200,176,138,0.18);
      max-width: 480px;
      width: 100%;
      padding: 52px 40px 40px;
      text-align: center;
    }
    .eyebrow {
      font-size: 10px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: rgba(200,176,138,0.65);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 18px;
    }
    .eyebrow::before, .eyebrow::after {
      content: '';
      width: 28px;
      height: 1px;
      background: var(--tan-l);
    }
    .brand {
      font-family: 'Playfair Display', serif;
      font-size: 34px;
      font-weight: 700;
      color: var(--cream);
      line-height: 1;
      margin: 0 0 24px;
    }
    .brand em {
      font-style: italic;
      color: var(--tan);
      font-weight: 400;
    }
    .sep {
      border: 0;
      border-top: 1px solid rgba(200,176,138,0.18);
      margin: 0 0 28px;
    }
    .question {
      font-size: 13px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: rgba(200,176,138,0.7);
      margin-bottom: 24px;
    }
    .age-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 28px;
    }
    .btn-yes {
      background: var(--tan);
      color: var(--green-d);
      border: none;
      padding: 22px 16px;
      font-family: 'Playfair Display', serif;
      font-size: 28px;
      font-weight: 700;
      cursor: pointer;
      transition: background .2s, transform .1s;
      line-height: 1;
    }
    .btn-yes:hover { background: #d9c09a; transform: translateY(-1px); }
    .btn-yes span {
      display: block;
      font-family: 'Lora', serif;
      font-size: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--green-d);
      margin-top: 6px;
      opacity: 0.75;
    }
    .btn-no {
      background: transparent;
      color: rgba(239,230,214,0.55);
      border: 1px solid rgba(200,176,138,0.2);
      padding: 22px 16px;
      font-family: 'Playfair Display', serif;
      font-size: 28px;
      font-weight: 700;
      cursor: pointer;
      transition: border-color .2s, color .2s;
      line-height: 1;
    }
    .btn-no:hover { border-color: rgba(200,176,138,0.5); color: rgba(239,230,214,0.8); }
    .btn-no span {
      display: block;
      font-family: 'Lora', serif;
      font-size: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-top: 6px;
      opacity: 0.6;
    }
    .warn {
      font-size: 11px;
      color: rgba(200,176,138,0.45);
      line-height: 1.7;
      padding-top: 20px;
      border-top: 1px solid rgba(200,176,138,0.12);
    }
    @media (max-width: 420px) {
      .card { padding: 36px 24px 28px; }
      .brand { font-size: 28px; }
      .btn-yes, .btn-no { font-size: 22px; padding: 18px 12px; }
    }
  </style>
</head>
<body>
  <main class="card" role="main">
    <div class="eyebrow">Mayorista · Chile</div>
    <h1 class="brand">Puro <em>Tabaco</em></h1>
    <hr class="sep">

    <p class="question">¿Cuántos años tienes?</p>

    <form method="post" novalidate>
      {% csrf_token %}
      <div class="age-buttons">
        <button type="submit" name="edad" value="mayor" class="btn-yes">
          +18
          <span>Soy mayor de edad</span>
        </button>
        <button type="submit" name="edad" value="menor" class="btn-no">
          −18
          <span>Soy menor de edad</span>
        </button>
      </div>
    </form>

    <p class="warn">
      Al ingresar confirmas que eres mayor de {{ edad_minima }} años y aceptas
      los términos del sitio. <strong>El tabaco es perjudicial para la salud.</strong>
    </p>
  </main>
</body>
</html>
